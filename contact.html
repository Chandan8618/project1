<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Alex through the accessible portfolio contact form.">

    <title>Contact | Alex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="#main" class="skip-link">Skip to main content</a>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main id="main">

        <section>

            <h2>Get In Touch</h2>

            <form action="#" method="post">

                <div>
                    <label for="name">Name:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div>
                    <label for="email">Email:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div>
                    <label for="subject">Subject:</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <div>
                    <label for="message">Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Alex. All rights reserved.</p>
    </footer>

</body>
</html>
